[project]
name = "dv360-pipeline"
version = "0.1.0"
description = "DV360 reporting automation: BigQuery query layer + Excel template writer"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.25.0",
    "db-dtypes>=1.3.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "pyarrow>=17.0.0",
    "streamlit>=1.38.0",
    # Scheduled runner: read the schedule Google Sheet + upload reports to Drive.
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "tzdata>=2024.1",
]

[project.scripts]
dv360-report = "dv360_pipeline.cli:main"
dv360-run-scheduled = "dv360_pipeline.scheduled:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dv360_pipeline"]
