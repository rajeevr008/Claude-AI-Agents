[project]
name = "dv360-pipeline"
version = "0.1.0"
description = "DV360 reporting automation: BigQuery query layer + Excel template writer"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.25.0",
    "db-dtypes>=1.3.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "pyarrow>=17.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dv360_pipeline"]
